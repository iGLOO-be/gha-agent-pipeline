name: Get PR from workflow run
description: >
  Public composite for consumer use. Resolves an open agent PR for a completed
  CI workflow_run event. Consumers use this in their own agent-on-ci-failure.yml
  jobs before calling agent-ci-fix-run (or before setup and agent-ci-fix-run).

inputs:
  required_label:
    description: Label a PR must carry to be treated as an agent PR
    default: agent-pr

outputs:
  skip:
    description: Whether to skip downstream jobs
    value: ${{ steps.resolve.outputs.skip }}
  pr_number:
    description: Pull request number
    value: ${{ steps.resolve.outputs.pr_number }}
  issue_number:
    description: Linked issue number parsed from agent branch name
    value: ${{ steps.resolve.outputs.issue_number }}
  head_ref:
    description: PR head branch name
    value: ${{ steps.resolve.outputs.head_ref }}
  head_sha:
    description: Workflow run head SHA
    value: ${{ steps.resolve.outputs.head_sha }}

runs:
  using: composite
  steps:
    - name: Read branch prefix from config
      id: read-config
      shell: bash
      run: |
        PREFIX=$(grep -oP 'branch_prefix:\s*\K\S+' .github/agent.config.yml 2>/dev/null || echo agent)
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

    - name: Resolve agent PR
      id: resolve
      uses: actions/github-script@v7
      env:
        AGENT_BRANCH_PREFIX: ${{ steps.read-config.outputs.prefix }}
      with:
        script: |
          const prefix = process.env.AGENT_BRANCH_PREFIX || 'agent'
          const prefixEscaped = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')

          const run = context.payload.workflow_run
          const headBranch = run.head_branch || ''
          const headSha = run.head_sha || ''

          if (!headBranch.startsWith(prefix + '/')) {
            core.setOutput('skip', 'true')
            core.info(`Skipping non-agent branch: ${headBranch}`)
            return
          }

          const owner = context.repo.owner
          const repo = context.repo.repo
          const pulls = await github.rest.pulls.list({
            owner,
            repo,
            head: `${owner}:${headBranch}`,
            state: 'open',
            per_page: 5
          })

          const pr = pulls.data.find((p) => p.head.sha === headSha)
          if (!pr) {
            core.setOutput('skip', 'true')
            core.info(`No open PR at head SHA ${headSha} for branch ${headBranch}`)
            return
          }

          const requiredLabel = '${{ inputs.required_label }}'
          if (!pr.labels.some((l) => l.name === requiredLabel)) {
            core.setOutput('skip', 'true')
            core.info(`Skipping PR #${pr.number}: missing ${requiredLabel} label`)
            return
          }

          const match = headBranch.match(new RegExp('^' + prefixEscaped + '/(\\d+)-'))
          if (!match) {
            core.setOutput('skip', 'true')
            core.info(`Could not parse issue number from branch ${headBranch}`)
            return
          }

          core.setOutput('skip', 'false')
          core.setOutput('pr_number', String(pr.number))
          core.setOutput('issue_number', match[1])
          core.setOutput('head_ref', headBranch)
          core.setOutput('head_sha', headSha)
