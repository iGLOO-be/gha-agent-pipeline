name: Clear agent resume labels
description: Remove the labels that mark a waiting/failed state when a new agent phase starts.
inputs:
  token:
    description: GitHub token with issues write permission.
    required: true
  issue_number:
    description: Issue number to clear labels from.
    required: true
  pr_number:
    description: Optional PR number to clear the same labels from.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const labels = ['agent-waiting-human', 'agent-failed'];

          async function clearLabels(issueNumber) {
            for (const labelName of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: labelName,
                });
                core.info(`Removed ${labelName} from #${issueNumber}`);
              } catch (error) {
                const status = error.status ?? error.response?.status;
                if (status === 404) {
                  core.info(`${labelName} was not present on #${issueNumber}`);
                } else {
                  throw error;
                }
              }
            }
          }

          const issueNumber = Number('${{ inputs.issue_number }}');
          await clearLabels(issueNumber);

          const prNumberRaw = '${{ inputs.pr_number }}';
          if (prNumberRaw) {
            const prNumber = Number(prNumberRaw);
            await clearLabels(prNumber);
          }
