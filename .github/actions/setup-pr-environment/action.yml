name: Setup PR Environment
description: Generate GitHub App token, checkout repository, and configure git for agent workflows

inputs:
  ref:
    description: Git ref to checkout (defaults to main)
    required: false
    default: main
  setup_environment:
    description: Whether to install dependencies with pnpm
    required: false
    default: "true"
  app_id:
    description: GitHub App ID for authentication
    required: true
  app_private_key:
    description: GitHub App private key for authentication
    required: true
  consumer_repository:
    description: Consumer repository to checkout (owner/name). Defaults to github.repository.
    required: false
    default: ""

outputs:
  app_token:
    description: GitHub App token for API and git operations
    value: ${{ steps.app_token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ steps.app_token.outputs.token }}
        repository: ${{ inputs.consumer_repository != '' && inputs.consumer_repository || github.repository }}
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Setup pnpm
      if: inputs.setup_environment == 'true'
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      if: inputs.setup_environment == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      if: inputs.setup_environment == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure Git
      shell: bash
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Configure git remote with token
      shell: bash
      run: |
        git remote set-url origin https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ github.repository }}.git
