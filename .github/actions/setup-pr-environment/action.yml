name: Setup PR Environment
description: Generate GitHub App token, checkout repository, and configure git for agent workflows

inputs:
  ref:
    description: Git ref to checkout (defaults to main)
    required: false
    default: main
  setup_environment:
    description: Whether to install dependencies with pnpm
    required: false
    default: "true"
  app_id:
    description: GitHub App ID for authentication
    required: true
  app_private_key:
    description: GitHub App private key for authentication
    required: true
  pipeline_repo:
    description: >
      Optional pipeline library repo name to include in the App token scope.
      Leave empty when the pipeline is public and installed via GITHUB_TOKEN.
      When set, the repo is added to the token's repository list for checkout.
    required: false
    default: ""

outputs:
  app_token:
    description: GitHub App token for API and git operations
    value: ${{ steps.app_token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: |
          ${{ github.event.repository.name }}
          ${{ inputs.pipeline_repo != '' && inputs.pipeline_repo || '' }}

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ steps.app_token.outputs.token }}
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Setup pnpm
      if: inputs.setup_environment == 'true'
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      if: inputs.setup_environment == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      if: inputs.setup_environment == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure Git
      shell: bash
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Configure git remote with token
      shell: bash
      run: |
        git remote set-url origin https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/${{ github.repository }}.git

    - name: Install graphify
      if: inputs.setup_environment == 'true'
      shell: bash
      run: |
        pip install graphifyy -q 2>/dev/null || pip install graphifyy -q --break-system-packages 2>/dev/null
        which graphify && graphify --version || echo "graphify not available"
