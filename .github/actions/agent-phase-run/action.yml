name: Run agent phase (post-setup)
description: |
  Orchestrates the shared post-environment-setup steps for the slash-command
  agent phases (plan, implement, yolo, review-fix, ask, code-review). Consumers keep their own
  `setup-pr-environment` step (checkout + package manager + token) and then
  call this composite once. This composite never performs environment setup
  (package manager, Node version, checkout ref, token generation).
inputs:
  phase:
    description: Command id for the agent CLI (built-in or custom from agent.config.yml).
    required: true
  runtime_phase:
    description: Runtime handler when phase is a custom command (defaults to phase).
    required: false
    default: ""
  command_args:
    description: Extra text from the slash command after the command token.
    required: false
    default: ""
  app_token:
    description: >
      GitHub App token produced by the consumer's setup step
      (e.g. steps.setup.outputs.app_token). Used for all GitHub API
      operations (labels, comments, agent GITHUB_TOKEN).
    required: true
  pipeline_install_token:
    description: >
      Token used only to checkout/install the pipeline library.
      Leave empty to use github.token (suitable for public pipeline repos).
      Set explicitly when the pipeline repo is private and requires the App token.
    required: false
    default: ""
  comment_id:
    description: Comment or review ID that triggered the workflow.
    required: true
  issue_number:
    description: Issue number this run targets.
    required: true
  pr_number:
    description: Pull request number (required for review-fix and code-review).
    required: false
  head_ref:
    description: PR head branch (required for review-fix and code-review; optional for yolo when targeting an existing branch).
    required: false
  base_branch:
    description: >
      Git base branch for sync and new branch creation when `.github/agent.config.yml`
      is missing on the checked-out ref (e.g. `next`). Passed as AGENT_BASE_BRANCH to the CLI.
    required: false
  review_feedback:
    description: Review feedback text for the agent (required for review-fix).
    required: false
  reaction_target:
    description: issue_comment or pull_request_review (required for review-fix).
    required: false
  question:
    description: Question text for the ask phase.
    required: false
  review_instructions:
    description: Optional extra instructions for the code-review phase.
    required: false
  chain_code_review:
    description: When true, implement or review-fix may dispatch a follow-up code-review after success.
    required: false
  review_loop_active:
    description: When true, this run is part of an implement-started review loop.
    required: false
    default: ""
  review_loop_round:
    description: Code-review round index within the review loop (0-based).
    required: false
    default: "0"
  pipeline_ref:
    description: >
      Git ref of the pipeline library runtime to install. Defaults to the ref of
      this composite action (e.g. the release tag you pinned). Override to track
      main or another ref explicitly.
    required: false
    default: ""
  pipeline_repository:
    description: Repository (owner/name) hosting the pipeline library.
    required: false
    default: iGLOO-be/gha-agent-pipeline
  node_version:
    description: Node.js version for pipeline install and agent CLI steps (match consumer engines / .node-version).
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Install agent pipeline
      id: pipeline
      uses: $/.github/actions/install-agent-pipeline
      with:
        token: ${{ inputs.pipeline_install_token != '' && inputs.pipeline_install_token || github.token }}
        pipeline_ref: ${{ inputs.pipeline_ref != '' && inputs.pipeline_ref || github.action_ref || 'main' }}
        pipeline_repository: ${{ inputs.pipeline_repository }}
        node_version: ${{ inputs.node_version }}

    - name: Resolve effective phase
      id: effective
      shell: bash
      run: |
        if [ -n "${{ inputs.runtime_phase }}" ]; then
          echo "phase=${{ inputs.runtime_phase }}" >> $GITHUB_OUTPUT
        else
          echo "phase=${{ inputs.phase }}" >> $GITHUB_OUTPUT
        fi

    - name: Run agent
      id: run-agent
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.app_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        PR_NUMBER: ${{ (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'ask' || steps.effective.outputs.phase == 'code-review') && inputs.pr_number || '' }}
        AGENT_BRANCH: ${{ (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'yolo' || steps.effective.outputs.phase == 'code-review') && inputs.head_ref || '' }}
        AGENT_BASE_BRANCH: ${{ inputs.base_branch }}
        REVIEW_FEEDBACK: ${{ steps.effective.outputs.phase == 'review-fix' && inputs.review_feedback || '' }}
        QUESTION: ${{ steps.effective.outputs.phase == 'ask' && inputs.question || '' }}
        REVIEW_INSTRUCTIONS: ${{ steps.effective.outputs.phase == 'code-review' && inputs.review_instructions || '' }}
        AGENT_COMMAND_ARGS: ${{ inputs.command_args }}
        REVIEW_FIX_CHAIN_CODE_REVIEW: ${{ steps.effective.outputs.phase == 'review-fix' && inputs.chain_code_review == 'true' && 'true' || '' }}
        IMPLEMENT_CHAIN_CODE_REVIEW: ${{ steps.effective.outputs.phase == 'implement' && inputs.chain_code_review == 'true' && 'true' || '' }}
        REVIEW_LOOP_ACTIVE: ${{ inputs.review_loop_active == 'true' && 'true' || '' }}
        REVIEW_LOOP_ROUND: ${{ inputs.review_loop_round }}
        COMMENT_ID: ${{ inputs.comment_id }}
        REACTION_TARGET: ${{ inputs.reaction_target || 'issue_comment' }}
        SUCCESS_REACTION: ${{ steps.effective.outputs.phase == 'plan' && '+1' || steps.effective.outputs.phase == 'ask' && 'rocket' || 'rocket' }}
      run: ${{ steps.pipeline.outputs.bin }} ${{ inputs.phase }}

    - name: Fallback failure comment
      if: failure() && steps.run-agent.outcome != 'success'
      uses: $/.github/actions/report-failure-fallback
      with:
        token: ${{ inputs.app_token || github.token }}
        phase: ${{ steps.effective.outputs.phase }}
        target_type: ${{ (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'code-review') && 'pr' || 'issue' }}
        target_number: ${{ (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'code-review') && inputs.pr_number || inputs.issue_number }}
        source_issue_number: ${{ (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'code-review') && inputs.issue_number || '' }}

    - name: Remove agent-working label on PR
      if: always() && (steps.effective.outputs.phase == 'review-fix' || steps.effective.outputs.phase == 'code-review')
      uses: $/.github/actions/manage-agent-working-label
      with:
        action: remove
        token: ${{ inputs.app_token || github.token }}
        pr_number: ${{ inputs.pr_number }}

    - name: Remove agent-working label on issue
      if: always()
      uses: $/.github/actions/manage-agent-working-label
      with:
        action: remove
        token: ${{ inputs.app_token || github.token }}
        issue_number: ${{ inputs.issue_number }}
