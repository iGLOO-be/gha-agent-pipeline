name: Manage agent-working label
description: Add or remove the agent-working lifecycle label on an issue and/or pull request.
inputs:
  action:
    description: Whether to add or remove the label.
    required: true
  token:
    description: GitHub token with issues write permission.
    required: true
  issue_number:
    description: Issue number to label.
    required: false
  pr_number:
    description: Pull request number to label.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const action = '${{ inputs.action }}';
          const issueNumberInput = '${{ inputs.issue_number }}';
          const prNumberInput = '${{ inputs.pr_number }}';
          const issueNumber = issueNumberInput ? Number(issueNumberInput) : null;
          const prNumber = prNumberInput ? Number(prNumberInput) : null;
          const labelName = 'agent-working';
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          if (!issueNumber && !prNumber) {
            core.setFailed('At least one of issue_number or pr_number must be provided.');
            return;
          }

          async function ensureLabel() {
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'f9d0c4',
                  description: 'Agent job in progress.',
                });
              } else {
                throw error;
              }
            }
          }

          async function manageLabel(number, kind) {
            if (action === 'add') {
              try {
                await ensureLabel();
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [labelName],
                });
                core.info(`Added ${labelName} to ${kind} #${number}`);
              } catch (error) {
                core.warning(`Failed to add ${labelName} to ${kind} #${number}: ${error.message}`);
              }
            } else if (action === 'remove') {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: labelName,
                });
                core.info(`Removed ${labelName} from ${kind} #${number}`);
              } catch (error) {
                const status = error.status ?? error.response?.status;
                if (status === 404) {
                  core.info(`${labelName} was not present on ${kind} #${number}`);
                } else {
                  core.warning(`Failed to remove ${labelName} from ${kind} #${number}: ${error.message}`);
                }
              }
            } else {
              core.setFailed(`Unknown action: ${action}. Expected "add" or "remove".`);
            }
          }

          if (issueNumber) await manageLabel(issueNumber, 'issue');
          if (prNumber) await manageLabel(prNumber, 'PR');
