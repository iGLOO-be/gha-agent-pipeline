name: Report agent failure fallback
description: >
  Post a fallback failure comment and label when the agent TypeScript runner did
  not have a chance to report (e.g. setup/install/OOM failure). This is a
  last-resort step used with `if: failure()` in agent workflows. It deduplicates
  by the agent-failed-run marker so it does not double-post if the TS helper
  already commented.

inputs:
  token:
    description: GitHub token with issues and pull-requests write permission.
    required: true
  phase:
    description: Agent phase that failed (plan, implement, yolo, review-fix, ci-fix, ask, code-review).
    required: true
  target_type:
    description: Either "issue" or "pr".
    required: true
  target_number:
    description: Issue or PR number to comment on.
    required: true
  source_issue_number:
    description: Source issue number for PR-driven phases (used to add agent-waiting-human).
    required: false

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const phase = '${{ inputs.phase }}';
          const targetType = '${{ inputs.target_type }}';
          const targetNumber = '${{ inputs.target_number }}' ? Number('${{ inputs.target_number }}') : NaN;
          const sourceIssueNumberRaw = '${{ inputs.source_issue_number }}';
          const sourceIssueNumber = sourceIssueNumberRaw ? Number(sourceIssueNumberRaw) : NaN;
          const runId = process.env.GITHUB_RUN_ID;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
          const marker = `<!-- agent-failed-run:${runId} -->`;

          const phaseTitles = {
            plan: 'Agent Plan Failed',
            implement: 'Agent Implement Failed',
            yolo: 'Agent Yolo Failed',
            'review-fix': 'Agent Review Fix Failed',
            'ci-fix': 'Agent CI Fix Failed',
            ask: 'Agent Ask Failed',
            'code-review': 'Agent Code Review Failed',
          };

          const phaseMarkers = {
            plan: '<!-- agent-plan-failed -->',
            implement: '<!-- agent-implement-failed -->',
            yolo: '<!-- agent-yolo-failed -->',
            'review-fix': '<!-- agent-review-fix-failed -->',
            'ci-fix': '<!-- agent-ci-fix-failed -->',
            ask: '<!-- agent-ask-failed -->',
            'code-review': '<!-- agent-code-review-failed -->',
          };

          if (!phaseTitles[phase]) {
            core.warning(`Unknown phase "${phase}". Skipping fallback.`);
            return;
          }

          if (!Number.isFinite(targetNumber)) {
            core.warning(`Invalid target number "${{ inputs.target_number }}". Skipping fallback.`);
            return;
          }

          const targetLabelNumber = targetNumber;

          try {
            const { data: existingComments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: targetNumber,
              per_page: 30,
            });

            if (existingComments.some((c) => c.body?.includes(marker))) {
              core.info('Found agent-failed-run marker for this run; fallback already reported.');
              return;
            }

            const title = phaseTitles[phase];
            const phaseMarker = phaseMarkers[phase] || '';
            const fallbackBody =
              phaseMarker + (phaseMarker ? '\n' : '') +
              '## ' + title + '\n\n' +
              'The agent failed before it could report from the runner (setup/install/OOM/crash). Fallback comment.\n\n' +
              '**Run:** [View in GitHub Actions](' + runUrl + ')\n\n' +
              marker;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: targetNumber,
              body: fallbackBody,
            });
            core.info(`Posted fallback failure comment for ${phase} on ${targetType} #${targetNumber}`);

            await (async function ensureAndAddFailedLabel() {
              const labelName = 'agent-failed';
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch (error) {
                const status = error.status ?? error.response?.status;
                if (status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: labelName,
                    color: 'd73a4a',
                    description: 'Agent pipeline failed on this issue or PR.',
                  });
                } else {
                  throw error;
                }
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: targetLabelNumber,
                labels: [labelName],
              });
            })();

            if (targetType === 'issue' || Number.isFinite(sourceIssueNumber)) {
              const waitingNumber = targetType === 'issue' ? targetNumber : sourceIssueNumber;
              await (async function ensureAndAddWaitingLabel() {
                const labelName = 'agent-waiting-human';
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: labelName });
                } catch (error) {
                  const status = error.status ?? error.response?.status;
                  if (status === 404) {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: labelName,
                      color: 'f9d0c4',
                      description: 'Waiting for human decision on this issue.',
                    });
                  } else {
                    throw error;
                  }
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: waitingNumber,
                  labels: [labelName],
                });
              })();
            }
          } catch (error) {
            core.warning(`Failed to post fallback failure comment: ${error.message}`);
          }
