version: 1

app:
  name: gha-agent-pipeline

git:
  base_branch: main
  pr_target: main
  branch_prefix: agent
  merge_strategy: merge

models:
  # Fallback slug per phase when Jev Router pool lists are empty; also the default
  # single candidate if jev_router is turned off.
  plan: deepseek/deepseek-v4-pro
  implement: deepseek/deepseek-v4-pro
  ci-fix: deepseek/deepseek-v4-pro
  review-fix: deepseek/deepseek-v4-pro
  ask: deepseek/deepseek-v4-pro
  code-review: deepseek/deepseek-v4-pro

openrouter:
  jev_router:
    enabled: true
    metadata: true
    # Budget pool: Jev picks model + reasoning effort inside these patterns.
    models:
      - deepseek/*
      - google/*flash*
      - qwen/*coder*
      - moonshotai/kimi-k2*
    excluded_models:
      - anthropic/claude-opus*
      - openai/o*
      - "*opus*"

prompts:
  plan:
    role_description: You are a planning agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  implement:
    role_description: You are an implementation agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  ci-fix:
    role_description: You are a CI fix agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  yolo:
    role_description: You are an implementation agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  review-fix:
    role_description: You are a review fix agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  ask:
    role_description: You are a Q&A agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).
  code-review:
    role_description: You are a code review agent for the gha-agent-pipeline monorepo (TypeScript library, packages/agent-pipeline, Vitest, GitHub Actions composites).

ci:
  max_rounds: 3

code_review:
  path_filters:
    - "!graphify-out/**"
    - "!pnpm-lock.yaml"

review_fix:
  follow_up:
    code_review: true

implement:
  follow_up:
    code_review: true

commands:
  config-audit:
    extends: ask
    slash: config-audit
    description: Explain agent.config.yml options and how this repo wires slash commands.
    prompts:
      append_instructions: |
        Focus on the commands section and consumer dispatch wiring when relevant.
