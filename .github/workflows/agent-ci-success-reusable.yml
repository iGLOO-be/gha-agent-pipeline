name: Agent CI Success (reusable)

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve agent PR
        id: pr
        uses: ./.github/actions/get-pr-from-workflow-run

      - name: Skip when not an agent PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "Skipping agent CI success comment"

      - name: Setup environment
        if: steps.pr.outputs.skip != 'true'
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          setup_environment: "false"
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Comment on agent PR when CI succeeds
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.setup.outputs.app_token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}')
            const branch = '${{ steps.pr.outputs.head_ref }}'
            const marker = '<!-- agent-ci-success -->'

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            })

            if (comments.data.some((comment) => comment.body?.includes(marker))) {
              core.info('CI success comment already posted')
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `${marker}\n✅ CI passed for \`${branch}\`.`
            })
