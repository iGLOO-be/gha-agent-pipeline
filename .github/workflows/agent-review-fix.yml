name: Agent Review Fix

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: Comment or review ID that triggered the workflow
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      issue_number:
        description: Linked issue number
        required: true
        type: string
      head_ref:
        description: PR head branch
        required: true
        type: string
      review_feedback:
        description: Review feedback text for the agent
        required: true
        type: string
      reaction_target:
        description: issue_comment or pull_request_review
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

run-name: "Agent Review Fix / PR #${{ github.event.inputs.pr_number }} / Issue #${{ github.event.inputs.issue_number }}"

concurrency:
  group: agent-issue-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  review-fix:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          ref: ${{ github.event.inputs.head_ref }}
          setup_environment: true
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install agent pipeline
        id: pipeline
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/install-agent-pipeline@main
        with:
          token: ${{ steps.setup.outputs.app_token }}

      - name: Run review fix agent
        id: run-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ steps.setup.outputs.app_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          AGENT_BRANCH: ${{ github.event.inputs.head_ref }}
          REVIEW_FEEDBACK: ${{ github.event.inputs.review_feedback }}
          COMMENT_ID: ${{ github.event.inputs.comment_id }}
          REACTION_TARGET: ${{ github.event.inputs.reaction_target }}
          SUCCESS_REACTION: rocket
        run: ${{ steps.pipeline.outputs.bin }} review-fix

      - name: Fallback failure comment
        if: failure() && steps.run-agent.outcome != 'success'
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/report-failure-fallback@main
        with:
          token: ${{ steps.setup.outputs.app_token || github.token }}
          phase: review-fix
          target_type: pr
          target_number: ${{ github.event.inputs.pr_number }}
          source_issue_number: ${{ github.event.inputs.issue_number }}

      - name: Remove agent-working label
        if: always()
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/manage-agent-working-label@main
        with:
          action: remove
          token: ${{ steps.setup.outputs.app_token || github.token }}
          issue_number: ${{ github.event.inputs.issue_number }}
          pr_number: ${{ github.event.inputs.pr_number }}
