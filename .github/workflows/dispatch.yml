name: Agent slash dispatch

# Invoked from the consumer repo (issue_comment / pull_request_review live there).
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label for the dispatch job
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: |
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body || '', '/agent fix') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          contains(github.event.comment.body || '', '/agent ask') ||
          contains(github.event.comment.body || '', '/agent plan') ||
          contains(github.event.comment.body || '', '/agent implement') ||
          contains(github.event.comment.body || '', '/agent yolo') ||
          contains(github.event.comment.body || '', '/agent fix') ||
          contains(github.event.comment.body || '', '/agent code-review') ||
          contains(github.event.comment.body || '', '/agent ')
        )
      )
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout agent config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      # Slash parsing scripts ship with the library release, not the consumer repo.
      - name: Checkout dispatch scripts (library)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _gha-agent-pipeline-dispatch

      - name: Parse slash command and dispatch workflow
        uses: actions/github-script@v7
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const {
              parseAgentCommandsFromYaml,
              parseAgentSlashInvocation,
              resolveSlashCommand
            } = require('./_gha-agent-pipeline-dispatch/.github/scripts/parse-agent-commands.cjs')
            const {
              formatUnknownAgentCommandReply,
              unknownCommandReason
            } = require('./_gha-agent-pipeline-dispatch/.github/scripts/format-unknown-agent-command.cjs')
            const { RESERVED } = require('./_gha-agent-pipeline-dispatch/.github/scripts/command-constants.cjs')
            const {
              REVIEW_FIX_TRIGGER_MAX_CHARS,
              truncateReviewFixFeedbackForDispatch
            } = require('./_gha-agent-pipeline-dispatch/.github/scripts/truncate-review-fix-feedback.cjs')
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR']
            const owner = context.repo.owner
            const repo = context.repo.repo
            const consumerRef = context.payload.repository.default_branch

            async function loadAgentCommands() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/agent.config.yml'
                })
                const content = Buffer.from(data.content, 'base64').toString('utf8')
                return parseAgentCommandsFromYaml(content)
              } catch (error) {
                core.warning(`Could not load agent.config.yml: ${error.message}`)
                return parseAgentCommandsFromYaml('version: 1\n')
              }
            }

            async function dispatchAgentPhase(inputs) {
              const dispatchUrl = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/agent-phase.yml/dispatches`
              const res = await fetch(dispatchUrl, {
                method: 'POST',
                headers: {
                  authorization: `token ${process.env.ACTIONS_TOKEN}`,
                  accept: 'application/vnd.github.v3+json',
                  'content-type': 'application/json'
                },
                body: JSON.stringify({
                  ref: consumerRef,
                  inputs
                })
              })
              if (!res.ok) {
                const text = await res.text()
                throw new Error(`Workflow dispatch failed (${res.status}): ${text}`)
              }
            }

            async function dispatchCodeReview({
              commentId,
              prNumber,
              issueNumber,
              headRef,
              reviewInstructions,
              authorAssociation
            }) {
              await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/agent-phase.yml/dispatches`,
                {
                  method: 'POST',
                  headers: {
                    authorization: `token ${process.env.ACTIONS_TOKEN}`,
                    accept: 'application/vnd.github.v3+json',
                    'content-type': 'application/json'
                  },
                  body: JSON.stringify({
                    ref: consumerRef,
                    inputs: {
                      phase: 'code-review',
                      runtime_phase: 'code-review',
                      comment_id: String(commentId),
                      pr_number: String(prNumber),
                      issue_number: String(issueNumber),
                      head_ref: headRef,
                      review_instructions: reviewInstructions,
                      author_association: authorAssociation
                    }
                  })
                }
              ).then(async (res) => {
                if (!res.ok) {
                  const text = await res.text()
                  throw new Error(`Workflow dispatch failed (${res.status}): ${text}`)
                }
              })
            }

            // Keep flags in sync with packages/agent-pipeline/src/code-review-chain.ts
            function wantsChainCodeReviewFromSlash(body, phase) {
              if (/\+code-review\b/i.test(body) || /--code-review\b/i.test(body)) {
                return true
              }
              // `--recheck` is the review-fix spelling; implement documents `+code-review` / `--code-review`.
              return phase === 'review-fix' && /--recheck\b/i.test(body)
            }

            function stripChainCodeReviewSlashFlags(body) {
              return body
                .replace(/--recheck\b/gi, '')
                .replace(/\+code-review\b/gi, '')
                .replace(/--code-review\b/gi, '')
                .replace(/\s+/g, ' ')
                .trim()
            }

            async function dispatchReviewFix({
              commentId,
              prNumber,
              issueNumber,
              headRef,
              reviewFeedback,
              reactionTarget,
              chainCodeReview,
              sourceUrl
            }) {
              const truncatedFeedback = truncateReviewFixFeedbackForDispatch(
                reviewFeedback,
                {
                  maxChars: REVIEW_FIX_TRIGGER_MAX_CHARS,
                  ...(sourceUrl ? { sourceUrl } : {})
                }
              )
              await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/agent-phase.yml/dispatches`,
                {
                  method: 'POST',
                  headers: {
                    authorization: `token ${process.env.ACTIONS_TOKEN}`,
                    accept: 'application/vnd.github.v3+json',
                    'content-type': 'application/json'
                  },
                  body: JSON.stringify({
                    ref: consumerRef,
                    inputs: {
                      phase: 'review-fix',
                      comment_id: String(commentId),
                      pr_number: String(prNumber),
                      issue_number: String(issueNumber),
                      head_ref: headRef,
                      review_feedback: truncatedFeedback,
                      reaction_target: reactionTarget,
                      ...(chainCodeReview ? { chain_code_review: 'true' } : {})
                    }
                  })
                }
              ).then(async (res) => {
                if (!res.ok) {
                  const text = await res.text()
                  throw new Error(`Workflow dispatch failed (${res.status}): ${text}`)
                }
              })
            }

            async function getBranchPrefix() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/agent.config.yml'
                })
                const content = Buffer.from(data.content, 'base64').toString('utf8')
                const match = content.match(/^\s*branch_prefix:\s*(.+)$/m)
                if (match) {
                  const val = match[1].trim().replace(/^['"]|['"]$/g, '')
                  if (val) return val
                }
              } catch {
                // config file missing or unreadable — fall back to default
              }
              return 'agent'
            }

            async function resolveAgentPullRequest(prNumber) {
              const branchPrefix = await getBranchPrefix()
              const escapedPrefix = branchPrefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              })
              if (!pr.head.ref.startsWith(branchPrefix + '/')) {
                core.info(`Non-agent PR branch: ${pr.head.ref}; treating PR #${pr.number} as both issue and PR`)
                return {
                  prNumber: pr.number,
                  issueNumber: pr.number,
                  headRef: pr.head.ref
                }
              }
              const match = pr.head.ref.match(new RegExp('^' + escapedPrefix + '/(\\d+)-'))
              if (!match) {
                core.info(`Could not parse issue number from branch ${pr.head.ref}`)
                return null
              }
              return {
                prNumber: pr.number,
                issueNumber: Number(match[1]),
                headRef: pr.head.ref
              }
            }

            async function isAgentBusy(issueNumber) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number: issueNumber
              })
              const hasWorkingLabel = labels.some((label) => label.name === 'agent-working')

              const agentWorkflowPaths = ['.github/workflows/agent-phase.yml']
              let busyRuns = []
              try {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  status: 'in_progress',
                  per_page: 100
                })
                busyRuns = data.workflow_runs.filter((run) => {
                  if (!agentWorkflowPaths.includes(run.path)) return false
                  const match = (run.display_title || '').match(/Issue #(\d+)/)
                  return match && Number(match[1]) === issueNumber
                })
              } catch (error) {
                core.warning(`Could not list in-progress workflow runs: ${error.message}`)
              }

              if (!hasWorkingLabel && busyRuns.length === 0) {
                return { busy: false }
              }

              const runUrl = busyRuns.length > 0 ? busyRuns[0].html_url : null
              return { busy: true, runUrl }
            }

            // Reserved slash tokens are wired directly in this workflow rather
            // than declared in `commands`, so they are not visible to
            // `loadAgentCommands()`.
            function reservedSlashTokensFor(target) {
              return target === 'pr' ? [...RESERVED] : []
            }

            // Posts a single explanatory comment when a syntactically valid
            // `/agent <slash>` invocation could not be dispatched. No eyes
            // reaction and no agent-phase run happen in that case.
            async function replyUnknownAgentCommand({
              issueNumber,
              slash,
              target,
              commands,
              reason
            }) {
              const resolvedReason =
                reason || unknownCommandReason({ slash, commands })
              const body = formatUnknownAgentCommandReply({
                slash,
                target,
                commands,
                reservedSlashTokens: reservedSlashTokensFor(target),
                ...(resolvedReason ? { reason: resolvedReason } : {})
              })
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              })
            }

            if (context.eventName === 'issue_comment') {
              const body = (context.payload.comment.body || '').trim()
              const isPullRequest = Boolean(context.payload.issue.pull_request)
              const authorAssociation = context.payload.comment.author_association
              const agentCommands = await loadAgentCommands()

              if (!allowed.includes(authorAssociation)) {
                core.info(`Skipping workflow: author association ${authorAssociation} not allowed`)
                return
              }

              if (isPullRequest) {
                const isFix = body.includes('/agent fix')
                const isCodeReview = body.includes('/agent code-review')

                if (!isFix && !isCodeReview && !body.toLowerCase().includes('/agent ')) {
                  core.info('No /agent command on PR comment')
                  return
                }

                const resolved = await resolveAgentPullRequest(context.payload.issue.number)
                if (!resolved) return

                const busy = await isAgentBusy(resolved.issueNumber)
                if (busy.busy) {
                  core.info(`Agent already working on issue #${resolved.issueNumber}; skipping dispatch`)
                  const busyBody = busy.runUrl
                    ? `🚫 **An agent is already working on this issue (#${resolved.issueNumber}).**\n\n🔗 [Follow current execution](${busy.runUrl})`
                    : `🚫 **An agent is already working on this issue (#${resolved.issueNumber}).**`
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: resolved.prNumber,
                    body: busyBody
                  })
                  return
                }

                const commentId = context.payload.comment.id

                if (isCodeReview) {
                  await github.rest.reactions.createForIssueComment({
                    owner,
                    repo,
                    comment_id: commentId,
                    content: 'eyes'
                  })
                  const reviewInstructions = body.replace(/\/agent\s+code-review/i, '').trim()
                  await dispatchCodeReview({
                    commentId,
                    prNumber: resolved.prNumber,
                    issueNumber: resolved.issueNumber,
                    headRef: resolved.headRef,
                    reviewInstructions,
                    authorAssociation
                  })
                  return
                }

                if (isFix) {
                  await github.rest.reactions.createForIssueComment({
                    owner,
                    repo,
                    comment_id: commentId,
                    content: 'eyes'
                  })
                  const rawFeedback = body.replace(/\/agent\s+fix/gi, '').trim() || body
                  const chainCodeReview = wantsChainCodeReviewFromSlash(rawFeedback, 'review-fix')
                  const feedback = stripChainCodeReviewSlashFlags(rawFeedback)
                  await dispatchReviewFix({
                    commentId,
                    prNumber: resolved.prNumber,
                    issueNumber: resolved.issueNumber,
                    headRef: resolved.headRef,
                    reviewFeedback: feedback,
                    reactionTarget: 'issue_comment',
                    chainCodeReview
                  })
                  return
                }

                const slashMatch = resolveSlashCommand(body, agentCommands)
                if (!slashMatch) {
                  core.info('Unrecognized /agent command on PR comment')
                  const parsed = parseAgentSlashInvocation(body)
                  if (parsed) {
                    await replyUnknownAgentCommand({
                      issueNumber: resolved.prNumber,
                      slash: parsed.slash,
                      target: 'pr',
                      commands: agentCommands
                    })
                  }
                  return
                }
                const { command, args } = slashMatch
                if (!command.targets.includes('pr')) {
                  core.info(`Command ${command.id} is not enabled on pull request comments`)
                  const parsed = parseAgentSlashInvocation(body)
                  await replyUnknownAgentCommand({
                    issueNumber: resolved.prNumber,
                    slash: parsed ? parsed.slash : command.slash,
                    target: 'pr',
                    commands: agentCommands,
                    reason: 'wrong-target'
                  })
                  return
                }

                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  content: 'eyes'
                })

                const runtimePhase = command.extends
                const question =
                  runtimePhase === 'ask'
                    ? args || 'Summarize the context and current agent status.'
                    : ''

                await dispatchAgentPhase({
                  phase: command.id,
                  runtime_phase: runtimePhase,
                  command_args: args,
                  comment_id: String(commentId),
                  issue_number: String(resolved.issueNumber),
                  pr_number: String(resolved.prNumber),
                  head_ref: resolved.headRef,
                  author_association: authorAssociation,
                  ...(runtimePhase === 'ask' ? { question } : {})
                })
                return
              }

              if (body.includes('/agent code-review')) {
                await replyUnknownAgentCommand({
                  issueNumber: context.payload.issue.number,
                  slash: 'code-review',
                  target: 'issue',
                  commands: agentCommands,
                  reason: 'wrong-target'
                })
                return
              }

              const slashMatch = resolveSlashCommand(body, agentCommands)
              if (!slashMatch) {
                core.info('No /agent slash command detected')
                const parsed = parseAgentSlashInvocation(body)
                if (parsed) {
                  await replyUnknownAgentCommand({
                    issueNumber: context.payload.issue.number,
                    slash: parsed.slash,
                    target: 'issue',
                    commands: agentCommands,
                    ...(RESERVED.has(parsed.slash) ? { reason: 'wrong-target' } : {})
                  })
                }
                return
              }

              const { command, args } = slashMatch
              if (!command.targets.includes('issue')) {
                core.info(`Command ${command.id} is not enabled on issue comments`)
                const parsed = parseAgentSlashInvocation(body)
                await replyUnknownAgentCommand({
                  issueNumber: context.payload.issue.number,
                  slash: parsed ? parsed.slash : command.slash,
                  target: 'issue',
                  commands: agentCommands,
                  reason: 'wrong-target'
                })
                return
              }

              const commentId = String(context.payload.comment.id)
              const issueNumber = String(context.payload.issue.number)

              const busy = await isAgentBusy(Number(issueNumber))
              if (busy.busy) {
                core.info(`Agent already working on issue #${issueNumber}; skipping dispatch`)
                const busyBody = busy.runUrl
                  ? `🚫 **An agent is already working on this issue (#${issueNumber}).**\n\n🔗 [Follow current execution](${busy.runUrl})`
                  : `🚫 **An agent is already working on this issue (#${issueNumber}).**`
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: Number(issueNumber),
                  body: busyBody
                })
                return
              }

              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: Number(commentId),
                content: 'eyes'
              })

              const runtimePhase = command.extends
              const question =
                runtimePhase === 'ask'
                  ? args || 'Summarize the context and current agent status.'
                  : ''
              const chainCodeReview =
                runtimePhase === 'implement' &&
                wantsChainCodeReviewFromSlash(body, 'implement')

              await dispatchAgentPhase({
                phase: command.id,
                runtime_phase: runtimePhase,
                command_args: args,
                comment_id: commentId,
                issue_number: issueNumber,
                author_association: authorAssociation,
                ...(runtimePhase === 'ask' ? { question } : {}),
                ...(chainCodeReview ? { chain_code_review: 'true' } : {})
              })
              return
            }

            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review
              const body = (review.body || '').trim()
              const authorAssociation = review.author_association

              if (!allowed.includes(authorAssociation)) {
                core.info(`Skipping review workflow: author association ${authorAssociation} not allowed`)
                return
              }

              if (!body.includes('/agent fix')) {
                core.info('No /agent fix in submitted review')
                return
              }

              const prNumber = context.payload.pull_request.number
              const resolved = await resolveAgentPullRequest(prNumber)
              if (!resolved) return

              const busy = await isAgentBusy(resolved.issueNumber)
              if (busy.busy) {
                core.info(`Agent already working on issue #${resolved.issueNumber}; skipping /agent fix dispatch`)
                const busyBody = busy.runUrl
                  ? `🚫 **An agent is already working on this issue (#${resolved.issueNumber}).**\n\n🔗 [Follow current execution](${busy.runUrl})`
                  : `🚫 **An agent is already working on this issue (#${resolved.issueNumber}).**`
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: resolved.prNumber,
                  body: busyBody
                })
                return
              }

              const rawFeedback = body.replace('/agent fix', '').trim() || body
              const chainCodeReview = wantsChainCodeReviewFromSlash(rawFeedback, 'review-fix')
              const feedback = stripChainCodeReviewSlashFlags(rawFeedback)

              let reviewComments = []
              try {
                const { data } = await github.rest.pulls.listCommentsForReview({
                  owner,
                  repo,
                  pull_number: prNumber,
                  review_id: review.id,
                })
                reviewComments = data
                if (reviewComments.length > 0) {
                  await github.rest.reactions.createForPullRequestReviewComment({
                    owner,
                    repo,
                    comment_id: reviewComments[0].id,
                    content: 'eyes',
                  })
                } else {
                  core.info(
                    'Review has no line comments; skipping eyes reaction because GitHub does not support reactions on pull request reviews directly.'
                  )
                }
              } catch (error) {
                core.warning(`Could not add eyes reaction to review: ${error.message}`)
              }

              await dispatchReviewFix({
                commentId: review.id,
                prNumber: resolved.prNumber,
                issueNumber: resolved.issueNumber,
                headRef: resolved.headRef,
                reviewFeedback: feedback,
                reactionTarget: 'pull_request_review',
                chainCodeReview,
                sourceUrl: review.html_url
              })
            }
