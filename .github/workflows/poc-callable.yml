# Cross-repo reusable workflow POC (Phase 2 #139).
# Callable from consumer repos via workflow_call.
name: POC Callable

on:
  workflow_call:
    inputs:
      message:
        description: Optional message from the caller
        required: false
        type: string
        default: "hello from library"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log caller context
        run: |
          echo "poc-callable: ok"
          echo "caller_repository=${{ github.repository }}"
          echo "caller_ref=${{ github.ref }}"
          echo "message=${{ inputs.message }}"
