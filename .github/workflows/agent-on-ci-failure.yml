name: Agent on CI failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: agent-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ci-fix:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: ./.github/workflows/agent-ci-fix.yml
    secrets: inherit
