name: Agent phase

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Agent phase to run
        required: true
        type: choice
        options:
          - plan
          - implement
          - yolo
          - review-fix
          - ask
      comment_id:
        description: Comment or review ID that triggered the workflow
        required: true
        type: string
      issue_number:
        description: Issue number
        required: true
        type: string
      author_association:
        description: Comment author association
        required: false
        type: string
      checkout_ref:
        description: Git ref to checkout (overrides head_ref when provided)
        required: false
        type: string
      pr_number:
        description: Pull request number (required for review-fix)
        required: false
        type: string
      head_ref:
        description: PR head branch (required for review-fix)
        required: false
        type: string
      review_feedback:
        description: Review feedback text for the agent (required for review-fix)
        required: false
        type: string
      reaction_target:
        description: issue_comment or pull_request_review (required for review-fix)
        required: false
        type: string
      question:
        description: Question text for the ask phase
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

run-name: "Agent ${{ inputs.phase }} / Issue #${{ inputs.issue_number }}"

concurrency:
  group: agent-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          ref: ${{ inputs.checkout_ref || inputs.head_ref || github.ref_name }}
          setup_environment: true
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run agent phase (post-setup)
        uses: ./.github/actions/agent-phase-run
        with:
          phase: ${{ inputs.phase }}
          app_token: ${{ steps.setup.outputs.app_token }}
          comment_id: ${{ inputs.comment_id }}
          issue_number: ${{ inputs.issue_number }}
          pr_number: ${{ inputs.pr_number }}
          head_ref: ${{ inputs.head_ref }}
          base_branch: main
          review_feedback: ${{ inputs.review_feedback }}
          reaction_target: ${{ inputs.reaction_target }}
          question: ${{ inputs.question }}
          node_version: "24"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
