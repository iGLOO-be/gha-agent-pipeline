name: Agent phase

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Command id to run (built-in phase or custom command from agent.config.yml)
        required: true
        type: string
      runtime_phase:
        description: Underlying runtime handler (plan, implement, yolo, review-fix, ask, code-review). Defaults to phase when omitted.
        required: false
        type: string
        default: ""
      command_args:
        description: Text after the slash command token
        required: false
        type: string
        default: ""
      comment_id:
        description: Comment or review ID that triggered the workflow
        required: true
        type: string
      issue_number:
        description: Issue number
        required: true
        type: string
      author_association:
        description: Comment author association
        required: false
        type: string
      checkout_ref:
        description: Git ref to checkout (overrides head_ref when provided)
        required: false
        type: string
      pr_number:
        description: Pull request number (required for review-fix and code-review)
        required: false
        type: string
      head_ref:
        description: PR head branch (required for review-fix and code-review)
        required: false
        type: string
      review_feedback:
        description: Review feedback text for the agent (required for review-fix)
        required: false
        type: string
      reaction_target:
        description: issue_comment or pull_request_review (required for review-fix)
        required: false
        type: string
      question:
        description: Question text for the ask phase
        required: false
        type: string
      review_instructions:
        description: Optional extra instructions for the code-review phase
        required: false
        type: string
      chain_code_review:
        description: When true, implement or review-fix dispatches a follow-up code-review after success
        required: false
        type: string
      review_loop_active:
        description: When true, this run is part of an implement-started review loop (code-review ↔ review-fix)
        required: false
        type: string
      review_loop_round:
        description: Code-review round index within the review loop (0-based)
        required: false
        type: string
        default: "0"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

run-name: "Agent ${{ inputs.phase }} / Issue #${{ inputs.issue_number }}"

concurrency:
  group: agent-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          ref: ${{ inputs.checkout_ref || inputs.head_ref || github.ref_name }}
          setup_environment: true
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run agent phase (post-setup)
        uses: ./.github/actions/agent-phase-run
        with:
          phase: ${{ inputs.phase }}
          runtime_phase: ${{ inputs.runtime_phase }}
          command_args: ${{ inputs.command_args }}
          app_token: ${{ steps.setup.outputs.app_token }}
          comment_id: ${{ inputs.comment_id }}
          issue_number: ${{ inputs.issue_number }}
          pr_number: ${{ inputs.pr_number }}
          head_ref: ${{ inputs.head_ref }}
          base_branch: main
          review_feedback: ${{ inputs.review_feedback }}
          reaction_target: ${{ inputs.reaction_target }}
          question: ${{ inputs.question }}
          review_instructions: ${{ inputs.review_instructions }}
          chain_code_review: ${{ inputs.chain_code_review }}
          review_loop_active: ${{ inputs.review_loop_active }}
          review_loop_round: ${{ inputs.review_loop_round }}
          node_version: "24"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
