name: Agent Implement

# Called from the consumer repo (thin agent-implement.yml wrapper). github.repository is the consumer.
on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
    inputs:
      comment_id:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      author_association:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

run-name: "Agent Implement / Issue #${{ inputs.issue_number }}"

jobs:
  implement:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          ref: ${{ github.ref_name }}
          setup_environment: true
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install agent pipeline
        id: pipeline
        uses: ./.github/actions/install-agent-pipeline
        with:
          token: ${{ steps.setup.outputs.app_token }}

      - name: Add agent-working label
        uses: ./.github/actions/manage-agent-working-label
        with:
          action: add
          token: ${{ steps.setup.outputs.app_token }}
          issue_number: ${{ inputs.issue_number }}

      - name: Post startup comment
        uses: ./.github/actions/post-agent-startup-comment
        with:
          phase: implement
          target_type: issue
          target_number: ${{ inputs.issue_number }}
          token: ${{ steps.setup.outputs.app_token }}

      - name: Clear agent resume labels
        uses: ./.github/actions/clear-agent-resume-labels
        with:
          token: ${{ steps.setup.outputs.app_token }}
          issue_number: ${{ inputs.issue_number }}

      - name: Run plan agent
        id: run-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ steps.setup.outputs.app_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: ${{ steps.pipeline.outputs.bin }} implement

      - name: Fallback failure comment
        if: failure() && steps.run-agent.outcome != 'success'
        uses: ./.github/actions/report-failure-fallback
        with:
          token: ${{ steps.setup.outputs.app_token || github.token }}
          phase: implement
          target_type: issue
          target_number: ${{ inputs.issue_number }}

      - name: React to comment
        if: success()
        uses: ./.github/actions/react-agent-trigger
        with:
          token: ${{ steps.setup.outputs.app_token }}
          comment_id: ${{ inputs.comment_id }}
          outcome: success
          success_reaction: "rocket"

      - name: React to comment on failure
        if: failure()
        uses: ./.github/actions/react-agent-trigger
        with:
          token: ${{ github.token }}
          comment_id: ${{ inputs.comment_id }}
          outcome: failure
          success_reaction: "rocket"

      - name: Remove agent-working label
        if: always()
        uses: ./.github/actions/manage-agent-working-label
        with:
          action: remove
          token: ${{ steps.setup.outputs.app_token }}
          issue_number: ${{ inputs.issue_number }}
