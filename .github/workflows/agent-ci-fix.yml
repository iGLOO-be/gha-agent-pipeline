name: Agent CI Fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Requires the GitHub App installation to grant Checks: Read (see README).
  checks: read
  actions: read

concurrency:
  group: agent-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ci-fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CI_MAX_ROUNDS: 3
    steps:
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            gha-agent-pipeline

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve agent PR
        id: pr
        uses: ./.github/actions/get-pr-from-workflow-run

      - name: Skip when not an agent PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "Skipping agent CI fix"

      - name: Setup environment
        if: steps.pr.outputs.skip != 'true'
        id: setup
        uses: ./.github/actions/setup-pr-environment
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          setup_environment: true
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install agent pipeline
        if: steps.pr.outputs.skip != 'true'
        id: pipeline
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/install-agent-pipeline@main
        with:
          token: ${{ steps.setup.outputs.app_token }}

      - name: Add agent-working label on issue
        if: steps.pr.outputs.skip != 'true'
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/manage-agent-working-label@main
        with:
          action: add
          token: ${{ steps.setup.outputs.app_token }}
          issue_number: ${{ steps.pr.outputs.issue_number }}

      - name: Add agent-working label on PR
        if: steps.pr.outputs.skip != 'true'
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/manage-agent-working-label@main
        with:
          action: add
          token: ${{ steps.setup.outputs.app_token }}
          pr_number: ${{ steps.pr.outputs.pr_number }}

      - name: Restore CI round counter
        if: steps.pr.outputs.skip != 'true'
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .agent-state/ci-round
          key: agent-ci-round-${{ steps.pr.outputs.pr_number }}-latest
          restore-keys: |
            agent-ci-round-${{ steps.pr.outputs.pr_number }}-

      - name: Enforce CI fix round limit
        if: steps.pr.outputs.skip != 'true'
        id: rounds
        uses: actions/github-script@v7
        env:
          CI_MAX_ROUNDS: ${{ env.CI_MAX_ROUNDS }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}')
            const issueNumberRaw = '${{ steps.pr.outputs.issue_number }}'
            const issueNumber = issueNumberRaw ? Number(issueNumberRaw) : NaN
            const marker = '<!-- agent-blocked -->'
            const maxRounds = Number(process.env.CI_MAX_ROUNDS) || 3
            const roundPath = '.agent-state/ci-round'

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            })

            if (comments.data.some((c) => c.body?.includes(marker))) {
              core.setOutput('blocked', 'true')
              return
            }

            let count = 0
            if (fs.existsSync(roundPath)) {
              const raw = fs.readFileSync(roundPath, 'utf8').trim()
              const parsed = Number.parseInt(raw, 10)
              if (Number.isFinite(parsed) && parsed >= 0) count = parsed
            }

            if (count >= maxRounds) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `${marker}\n⛔ CI auto-fix stopped after ${maxRounds} attempts on this PR. Please fix manually or delete the cache entries starting with \`agent-ci-round-${prNumber}-\`.`
              })

              if (Number.isFinite(issueNumber)) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: 'agent-waiting-human' })
                } catch (labelError) {
                  if (labelError.status === 404) {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: 'agent-waiting-human',
                      color: 'f9d0c4',
                      description: 'Waiting for human decision on this issue.'
                    })
                  } else {
                    throw labelError
                  }
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['agent-waiting-human']
                })
              }

              core.setOutput('blocked', 'true')
              return
            }

            count += 1
            fs.mkdirSync('.agent-state', { recursive: true })
            fs.writeFileSync(roundPath, String(count))
            core.setOutput('blocked', 'false')
            core.setOutput('round', String(count))

      - name: Save CI round counter
        if: always() && steps.pr.outputs.skip != 'true' && steps.rounds.outcome == 'success' && steps.rounds.outputs.blocked != 'true'
        uses: actions/cache/save@v4
        with:
          path: .agent-state/ci-round
          key: agent-ci-round-${{ steps.pr.outputs.pr_number }}-${{ steps.rounds.outputs.round }}

      - name: Clear agent resume labels
        if: steps.pr.outputs.skip != 'true' && steps.rounds.outputs.blocked != 'true'
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/clear-agent-resume-labels@main
        with:
          token: ${{ steps.app_token.outputs.token }}
          issue_number: ${{ steps.pr.outputs.issue_number }}
          pr_number: ${{ steps.pr.outputs.pr_number }}

      - name: Run CI fix agent
        id: run-agent
        if: steps.pr.outputs.skip != 'true' && steps.rounds.outputs.blocked != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ steps.setup.outputs.app_token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AGENT_BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: ${{ steps.pipeline.outputs.bin }} ci-fix

      - name: Fallback failure comment
        if: failure() && steps.run-agent.outcome != 'success'
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/report-failure-fallback@main
        with:
          token: ${{ steps.setup.outputs.app_token || steps.app_token.outputs.token || github.token }}
          phase: ci-fix
          target_type: pr
          target_number: ${{ steps.pr.outputs.pr_number }}
          source_issue_number: ${{ steps.pr.outputs.issue_number }}

      - name: Remove agent-working label on issue
        if: always() && (steps.pr.outputs.issue_number || steps.pr.outputs.pr_number)
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/manage-agent-working-label@main
        with:
          action: remove
          token: ${{ steps.setup.outputs.app_token || steps.app_token.outputs.token }}
          issue_number: ${{ steps.pr.outputs.issue_number }}

      - name: Remove agent-working label on PR
        if: always() && (steps.pr.outputs.issue_number || steps.pr.outputs.pr_number)
        uses: iGLOO-be/gha-agent-pipeline/.github/actions/manage-agent-working-label@main
        with:
          action: remove
          token: ${{ steps.setup.outputs.app_token || steps.app_token.outputs.token }}
          pr_number: ${{ steps.pr.outputs.pr_number }}
