name: Agent CI Success

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            gha-agent-pipeline

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve agent PR
        id: pr
        uses: ./.github/actions/get-pr-from-workflow-run

      - name: Skip when not an agent PR
        if: steps.pr.outputs.skip == 'true'
        run: echo "Skipping agent CI success comment"

      - name: Comment on agent PR when CI succeeds
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = Number('${{ steps.pr.outputs.pr_number }}')
            const branch = '${{ steps.pr.outputs.head_ref }}'
            const marker = '<!-- agent-ci-success -->'

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            })

            if (comments.data.some((comment) => comment.body?.includes(marker))) {
              core.info('CI success comment already posted')
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `${marker}\n✅ CI passed for \`${branch}\`.`
            })
