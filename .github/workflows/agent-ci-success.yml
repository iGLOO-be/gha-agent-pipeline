name: Agent CI Success

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: agent-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/agent-ci-success-reusable.yml
    secrets: inherit
