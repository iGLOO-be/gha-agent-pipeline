name: Agent PR-opened review

# Gate for a pull request that becomes reviewable. The caller chooses the runner.
# This job does not set up Node, does not install the model, and takes no
# model secret or App private key. Setup and the review job stay on the
# consumer phase workflow.
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label for the PR-opened review gate
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  pr-opened-review:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      # Decision scripts ship with the library release, not the consumer repo.
      - name: Checkout PR-opened review scripts (library)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _gha-agent-pipeline-pr-opened-review

      - name: Decide and dispatch PR-opened review
        uses: actions/github-script@v7
        with:
          script: |
            const { decidePrOpenedReview } = require('./_gha-agent-pipeline-pr-opened-review/.github/scripts/decide-pr-opened-review.cjs')
            const {
              readBranchPrefix,
              prOpenedReviewWorkflowInputs
            } = require('./_gha-agent-pipeline-pr-opened-review/.github/scripts/pr-opened-review-dispatch.cjs')

            const owner = context.repo.owner
            const repo = context.repo.repo
            const defaultBranch = context.payload.repository.default_branch
            const prNumber = context.payload.pull_request.number

            let configText = null
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/agent.config.yml',
                ref: defaultBranch
              })
              if (data && typeof data.content === 'string') {
                configText = Buffer.from(data.content, 'base64').toString('utf8')
              }
            } catch (error) {
              core.warning(
                `Could not read .github/agent.config.yml on ${defaultBranch}: ${error.message}`
              )
            }

            const branchPrefix = readBranchPrefix(configText)
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            })
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            })
            const decision = decidePrOpenedReview({
              event: { action: context.payload.action },
              pullRequest,
              reviews,
              branchPrefix
            })

            if (decision.outcome !== 'dispatch') {
              core.info('PR-opened review skipped')
              return
            }

            const inputs = prOpenedReviewWorkflowInputs(decision.dispatch)
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'agent-phase.yml',
              ref: defaultBranch,
              inputs
            })
            core.info(
              `Dispatched PR-opened review for #${inputs.pr_number} (${inputs.head_ref})`
            )
